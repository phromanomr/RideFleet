# Workflow de CI do VrumVrum

name: Continuous Integration

on: 
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Using python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      - name: install requirements
        run: |
          pip install -r requirements.txt

      - name: docker compose
        run: |
          docker compose up -d vrumvrum-db
          sleep 5

      # setup do banco de dados mockado
      - name: setup test dataset
        run: |
          docker compose exec -T vrumvrum-db psql -U postgres -c "CREATE DATABASE vrumvrum_test;"

      # Execução dos testes unitários
      - name: execute unitary tests
        env:
          PYTHONPATH: .
        run: |
          pytest -k "not contract_test and not audit_test" -s -v

       # Execução dos testes de contrato
      - name: execute integration tests
        env:
          PYTHONPATH: .
        run: |
          pytest -k "contract_test and audit_test" -s -v

  build-and-push:
      runs-on: ubuntu-latest
      needs: continuous-integration
      if: github.ref == 'refs/heads/main'
      
      steps:
        - uses: actions/checkout@v4
        
        - name: Log in Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: phromanomr1/vrumvrum-api:latest

  deploy:
      runs-on: ubuntu-latest
      needs: build-and-push
      if: github.ref == 'refs/heads/main'
      
      steps:
        - name: Deploy to Server via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cd /caminho/para/sua/pasta/RideFleet
              docker compose pull vrumvrum
              docker compose up -d --no-deps vrumvrum