services:

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    networks:
      - vrumvrum-net

  api_1:
    build: .
    restart: always
    environment:
      SERVICE_NAME: vrumvrum
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vrumvrum
      INSTANCE_ID: api_1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vrumvrum-net

  api_2:
    build: .
    restart: always
    environment:
      SERVICE_NAME: vrumvrum
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vrumvrum
      INSTANCE_ID: api_2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vrumvrum-net

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vrumvrum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vrumvrum-net

volumes:
  pgdata:

networks:
  vrumvrum-net:
    driver: bridge