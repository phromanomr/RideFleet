services:

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api_1
      - api_2
    networks:
      - vrumvrum-net

  api_1:
    build: .
    restart: always
    environment:
      SERVICE_NAME: vrumvrum
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vrumvrum
      INSTANCE_ID: api_1
      RABBITMQ_URL: amqp://myuser:mypassword@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - db
    command: [
      "dockerize",
      "-wait", "tcp://rabbitmq:5672",
      "-timeout", "60s",
      "./entrypoint.sh"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vrumvrum-net

  api_2:
    build: .
    restart: always
    environment:
      SERVICE_NAME: vrumvrum
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vrumvrum
      INSTANCE_ID: api_2
      RABBITMQ_URL: amqp://myuser:mypassword@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - db
    command: [
      "dockerize",
      "-wait", "tcp://rabbitmq:5672",
      "-timeout", "60s",
      "./entrypoint.sh"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vrumvrum-net

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vrumvrum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vrumvrum-net

  rabbitmq:
    image: rabbitmq:3.9.4-management
    container_name: ridefleet-rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=mypassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_support", "5672"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vrumvrum-net

  # -------------------------------------------------------------------------
  # Prometheus — coleta métricas do endpoint /metrics das APIs a cada 10s
  # Acesse em: http://localhost:9090
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vrumvrum-net

  # -------------------------------------------------------------------------
  # Grafana — dashboards visuais lendo do Prometheus
  # Acesse em: http://localhost:3000  (admin / admin no primeiro login)
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - vrumvrum-net

volumes:
  pgdata:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  vrumvrum-net:
    driver: bridge