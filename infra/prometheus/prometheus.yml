global:
  scrape_interval: 10s      # coleta métricas a cada 10 segundos
  evaluation_interval: 10s

scrape_configs:
  - job_name: "vrumvrum_api_1"
    static_configs:
      - targets: ["api_1:8000"]   # nome do serviço no docker-compose

  - job_name: "vrumvrum_api_2"
    static_configs:
      - targets: ["api_2:8000"]